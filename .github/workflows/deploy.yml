# Redeploy the server when its code changes (data updates ship as bundles and don't need this).
# Opt in by setting the repo variable GT_DEPLOY_COMMAND to the command that deploys your image,
# with whatever secrets it needs. For Fly.io (docs/deploy.md):
#   GT_DEPLOY_COMMAND = flyctl deploy --remote-only --build-arg GT_BUILD_COMMIT=$GITHUB_SHA
#   GT_DEPLOY_PLATFORM = fly        (installs flyctl)
#   secret FLY_API_TOKEN            (from `fly tokens create deploy`)
name: deploy
on:
  push:
    branches: [main]
    paths: ["groundtruth/**", "Dockerfile", "pyproject.toml", ".github/workflows/deploy.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.GT_DEPLOY_COMMAND != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . && python -m unittest discover -s tests && python -m groundtruth check --production
      - if: vars.GT_DEPLOY_PLATFORM == 'fly'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - run: bash -c "$GT_DEPLOY_COMMAND"
        env:
          GT_DEPLOY_COMMAND: ${{ vars.GT_DEPLOY_COMMAND }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
