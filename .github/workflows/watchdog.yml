# Daily outside-in check. A failed run is the alert (GitHub emails you). It fails when:
#   - ALERTS.md lists an open alert from the refresh host (./gt host),
#   - no `refresh:` commit landed in 30 hours (only when groundtruth.yaml names a host),
#   - CI failed on main's head commit,
#   - and, once `url:` in groundtruth.yaml (or the repo variable GT_WATCHDOG_URL) names your
#     /mcp URL, plus the secret GT_MCP_API_KEY if the server uses one: the server is down,
#     can't install data bundles, has data older than GT_MAX_DATA_AGE_HOURS (default 192),
#     or runs code more than 72 hours behind main.
name: watchdog
on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m groundtruth watchdog --repo --max-age-hours "${GT_MAX_DATA_AGE_HOURS:-192}" ${GT_WATCHDOG_URL:+--url "$GT_WATCHDOG_URL"}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GT_WATCHDOG_URL: ${{ vars.GT_WATCHDOG_URL }}
          GT_MAX_DATA_AGE_HOURS: ${{ vars.GT_MAX_DATA_AGE_HOURS }}
          GT_MCP_API_KEY: ${{ secrets.GT_MCP_API_KEY }}
