name: "{{NAME}}"
template_description: A college or university. Term deadlines, tuition, office contacts, admissions and registration guides.

about: >
  The student assistant for {{NAME}}. Answers questions about deadlines,
  tuition and fees, admissions, registration, and which office to contact.

search:
