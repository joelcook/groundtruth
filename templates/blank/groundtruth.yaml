name: "{{NAME}}"
template_description: The smallest working assistant. One facts file, one wiki page, three eval questions.

# One or two sentences: who this assistant serves and what it covers.
# It becomes the instructions every connected chat client sees.
about: >
  Answers questions about {{NAME}}: what we do, how to reach us, and how things work.

search:
  # Words people type -> words your pages use. Add one each time search misses.
  synonyms:
    contact: [reach, call, email, phone]

# The one machine that refreshes, rewrites stale pages, and pushes main on its own
# (./gt host install): its short hostname, from `hostname -s`. Every other machine
# stands down, so only one ever pushes. See docs/operations.md.
# host: my-server

ingest:
  # URLs, sitemap.xml links, or folders. `./gt ingest` and the weekly refresh pull these.
  sources: []
