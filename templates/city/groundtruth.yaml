name: "{{NAME}}"
template_description: A city or county. Permit and license fees, trash pickup by zone, office hours, how-to guides.

about: >
  The resident assistant for {{NAME}}. Answers questions about permits and
  fees, trash and recycling pickup, and which city office to contact.

search:
  synonyms:
    trash: [garbage, recycling, pickup, collection, bin]
    permit: [permits, license, licence, approval]
    fee: [fees, cost, price]

# The one machine that refreshes, rewrites stale pages, and pushes main on its own
# (./gt host install): its short hostname, from `hostname -s`. Every other machine
# stands down, so only one ever pushes. See docs/operations.md.
# host: my-server

ingest:
  sources: []   # e.g. https://www.example.gov/sitemap.xml
