# Captured fact evidence for the example domain (Maplewood Public Library).
#
# Think of this file as the structured output of a scraper: the immutable
# evidence layer. You do not hand-tune the database; you edit the evidence here
# (or re-run a crawler that writes it) and then `scripts/build_db.py` projects
# it into db/groundtruth.db. Every row names the source page it came from, so
# every fact in the running system can be traced back to a human-verifiable URL.
#
# When you adopt groundtruth: delete this file, write your own crawler (or hand-
# author evidence like this), and update build_db.py's loaders to match.

